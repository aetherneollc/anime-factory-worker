name: CI

on:
  push:
  pull_request:

env:
  VAST_DRY_RUN: "1"
  ANIME_FACTORY_LIVE_VAST: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python package (dev extras)
        run: pip install -e "python/[dev]"
      - name: Run worker Python tests
        run: make test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          sudo tar --extract --gzip --file "${archive}" --directory /usr/local/bin gitleaks
      - name: Secret scan (Gitleaks CLI)
        run: gitleaks git --redact --no-banner --verbose .

  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate GPU worker Dockerfile (BuildKit check, no RUN)
        run: make docker-check
