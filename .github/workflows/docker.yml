name: Docker image

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "python/gpu_worker/**"
      - "python/anime_factory/**"
      - "python/pyproject.toml"
      - "schema/**"
      - "workflows/**"
      - "config/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  VAST_DRY_RUN: "1"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.load.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        name: Load enabled docker targets
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("deploy/docker-targets.json").read_text(encoding="utf-8"))
          enabled = [t for t in data.get("targets", []) if t.get("enabled")]
          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as fh:
              fh.write(f"targets={json.dumps(enabled)}\n")
          print(json.dumps(enabled, indent=2))
          PY

  moss:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        name: Reuse moss:main when the moss image inputs did not change
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/anime-factory-worker-moss"
          published="${image}:main"
          echo "built_image=${image}:sha-${short}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${short}"
            echo "${image}:main"
            echo "${image}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          rebuild=1
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && [ -n "${before}" ] \
             && [ "${before}" != "0000000000000000000000000000000000000000" ] \
             && docker buildx imagetools inspect "${published}" >/dev/null 2>&1; then
            if git fetch --depth=1 origin "${before}" \
               && git diff --quiet "${before}" "${GITHUB_SHA}" -- \
                    deploy/gpu-worker/Dockerfile.moss \
                    deploy/gpu-worker/install_moss_sfx_runtime.sh \
                    deploy/gpu-worker/pins.env; then
              rebuild=0
            fi
          fi
          echo "rebuild=${rebuild}" >> "$GITHUB_OUTPUT"
          if [ "${rebuild}" = "0" ]; then
            echo "image=${published}" >> "$GITHUB_OUTPUT"
            echo "Reusing ${published}"
          else
            echo "image=${image}:sha-${short}" >> "$GITHUB_OUTPUT"
            echo "Rebuilding moss"
          fi
      - uses: docker/build-push-action@v6
        if: steps.decide.outputs.rebuild == '1'
        with:
          context: .
          file: deploy/gpu-worker/Dockerfile.moss
          platforms: linux/amd64
          push: true
          tags: ${{ steps.decide.outputs.tags }}
          cache-from: |
            type=gha,scope=anime-factory-gpu-moss,ignore-error=true
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/anime-factory-worker-moss:main,ignore-error=true
          cache-to: type=gha,mode=min,scope=anime-factory-gpu-moss,ignore-error=true

  kv-dequant:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby
          sudo docker image prune --all --force || true
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        name: Reuse kv-dequant:main when the kernel pin did not change
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/anime-factory-worker-kv-dequant"
          published="${image}:main"
          echo "built_image=${image}:sha-${short}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${short}"
            echo "${image}:main"
            echo "${image}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          rebuild=1
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && [ -n "${before}" ] \
             && [ "${before}" != "0000000000000000000000000000000000000000" ] \
             && docker buildx imagetools inspect "${published}" >/dev/null 2>&1; then
            if git fetch --depth=1 origin "${before}" \
               && git diff --quiet "${before}" "${GITHUB_SHA}" -- \
                    deploy/gpu-worker/Dockerfile.kv-dequant \
                    deploy/gpu-worker/patches/kv_dequant_sm120a.patch \
                    deploy/gpu-worker/pins.env; then
              rebuild=0
            fi
          fi
          echo "rebuild=${rebuild}" >> "$GITHUB_OUTPUT"
          if [ "${rebuild}" = "0" ]; then
            echo "image=${published}" >> "$GITHUB_OUTPUT"
            echo "Reusing ${published}"
          else
            echo "image=${image}:sha-${short}" >> "$GITHUB_OUTPUT"
            echo "Rebuilding kv-dequant wheel"
          fi
      - uses: docker/build-push-action@v6
        if: steps.decide.outputs.rebuild == '1'
        with:
          context: .
          file: deploy/gpu-worker/Dockerfile.kv-dequant
          platforms: linux/amd64
          push: true
          tags: ${{ steps.decide.outputs.tags }}
          cache-from: |
            type=gha,scope=anime-factory-gpu-kv-dequant,ignore-error=true
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/anime-factory-worker-kv-dequant:main,ignore-error=true
          cache-to: type=gha,mode=max,scope=anime-factory-gpu-kv-dequant,ignore-error=true

  docker:
    needs: [matrix, moss, kv-dequant]
    runs-on: ubuntu-latest
    # Official PyTorch runtime + pinned wheels. No CUDA-devel compile in this job.
    timeout-minutes: 45
    if: needs.matrix.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        env:
          IMAGE_NAME: ${{ matrix.target.image_name }}
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          short="${GITHUB_SHA::7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${owner}/${IMAGE_NAME}:sha-${short}"
            echo "ghcr.io/${owner}/${IMAGE_NAME}:main"
            echo "ghcr.io/${owner}/${IMAGE_NAME}:${GITHUB_SHA}"
            echo "ghcr.io/${owner}/${IMAGE_NAME}:${TARGET_ID}-main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          platforms: ${{ join(matrix.target.platforms, ',') }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            MOSS_IMAGE=${{ needs.moss.outputs.image }}
            KV_DEQUANT_IMAGE=${{ needs.kv-dequant.outputs.image }}
          cache-from: |
            type=gha,scope=anime-factory-gpu-${{ matrix.target.id }},ignore-error=true
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image_name }}:main,ignore-error=true
          cache-to: type=gha,mode=min,scope=anime-factory-gpu-${{ matrix.target.id }},ignore-error=true
