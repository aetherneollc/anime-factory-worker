name: Docker image

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "python/gpu_worker/**"
      - "python/anime_factory/**"
      - "python/pyproject.toml"
      - "schema/**"
      - "workflows/**"
      - "config/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  VAST_DRY_RUN: "1"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.load.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        name: Load enabled docker targets
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("deploy/docker-targets.json").read_text(encoding="utf-8"))
          enabled = [t for t in data.get("targets", []) if t.get("enabled")]
          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as fh:
              fh.write(f"targets={json.dumps(enabled)}\n")
          print(json.dumps(enabled, indent=2))
          PY

  docker:
    needs: matrix
    runs-on: ubuntu-latest
    # The longlive target compiles FlashAttention 2.8.3, FourOverSix and the
    # LongLive KV-dequant extension from source for SM 12.0. 360 minutes is the
    # GitHub-hosted runner maximum and the only budget that fits those builds.
    timeout-minutes: 360
    if: needs.matrix.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h

      # nvcc peaks well above the 16 GB runner RAM with MAX_JOBS=2 x NVCC_THREADS=2.
      # Swap keeps the CUDA extension builds from being OOM-killed mid-compile.
      - name: Add build swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/buildswap
          sudo chmod 600 /mnt/buildswap
          sudo mkswap /mnt/buildswap
          sudo swapon /mnt/buildswap
          free -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        env:
          IMAGE_NAME: ${{ matrix.target.image_name }}
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          short="${GITHUB_SHA::7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${owner}/${IMAGE_NAME}:sha-${short}"
            echo "ghcr.io/${owner}/${IMAGE_NAME}:main"
            echo "ghcr.io/${owner}/${IMAGE_NAME}:${GITHUB_SHA}"
            echo "ghcr.io/${owner}/${IMAGE_NAME}:${TARGET_ID}-main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          platforms: ${{ join(matrix.target.platforms, ',') }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=anime-factory-gpu-${{ matrix.target.id }}
          cache-to: type=gha,mode=max,scope=anime-factory-gpu-${{ matrix.target.id }},ignore-error=true
