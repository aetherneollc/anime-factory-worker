name: Publish GHCR packages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-packages.yml"
  workflow_run:
    workflows: ["Docker image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  public:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - anime-factory-worker-h3
          - anime-factory-worker-longlive
    steps:
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: |
          endpoint="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}"
          if gh api --method PATCH "${endpoint}" -f visibility=public; then
            visibility="$(gh api "${endpoint}" --jq .visibility)"
            test "${visibility}" = "public"
            exit 0
          fi

          # GitHub can deny repository GITHUB_TOKEN access to organization-owned
          # package settings even though image pushes work. Existing package
          # visibility persists across versions, so surface this as an explicit
          # warning without turning an otherwise healthy image build red.
          echo "::warning::Could not change ${PACKAGE} visibility. Verify the GHCR package is Public in organization settings."
          exit 0
