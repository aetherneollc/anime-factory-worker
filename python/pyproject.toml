[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-factory"
version = "0.1.0"
description = "Anime Factory GPU worker runtime (ComfyUI + H3 + agent)"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embed = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["anime_factory*", "gpu_worker*"]

[tool.pytest.ini_options]
testpaths = ["../tests", "tests", "gpu_worker/tests"]
pythonpath = ["."]
